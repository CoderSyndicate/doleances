  <h1>{{ .T "around.title" }}</h1>
  <p class="lede">{{ .T "around.lede" }}</p>
</div>

<div id="map" data-country="{{ .Country }}" data-groups="true"></div>

  <p><a class="button" href="/groups/new">{{ .T "group.propose" }}</a></p>
</div>
{{end}}
