"archive.contains" = "Cette archive contient :"
"archive.download" = "Télécharger"
"archive.privacy" = "Aucune donnée personnelle. Le registre est anonyme par construction — pas d'adresses e-mail, pas de jetons de suppression, rien qui identifie quiconque. C'est pourquoi il peut être remis à n'importe qui."
"archive.none" = "Aucune archive n'a encore été générée. Reviens bientôt."
"archive.inside_title" = "Ce qu'elle contient"
"archive.inside" = "Une archive zip de fichiers lisibles. Chaque doléance est un fichier Markdown : la date, la langue, les sujets attribués et le lieu si l'auteur en a pointé un, puis le texte exactement tel qu'il a été écrit. Personne ici ne peut modifier une doléance, pas même l'exploitant du site : ce que tu obtiens est ce qui a été écrit. Décompresse et lis avec n'importe quoi."
"archive.mirror_title" = "La dupliquer"
"archive.mirror" = "Héberge le fichier toi-même, partage-le, confie-le à une archive, charge-le dans une autre installation de ce logiciel. Une doléance supprimée par son auteur est absente de toute archive produite après cette suppression — les copies plus anciennes chez d'autres sont le prix d'un registre public, et le formulaire le dit avant que quiconque écrive un mot."
"archive.source_title" = "Le logiciel est libre aussi"
"archive.source" = "Le fichier n'en est que la moitié. Ce site est open source : ce qui lit le registre est donc aussi disponible que le registre lui-même — tu ne dépends de nous pour maintenir ni l'un ni l'autre."
"archive.source_run" = "Le projet publie des binaires prêts à l'emploi et des images de conteneur : remettre cette archive en ligne tient du téléchargement et d'une commande, pas d'une compilation. Forke-le, fais-le tourner pour ta commune, change ce que tu veux."
