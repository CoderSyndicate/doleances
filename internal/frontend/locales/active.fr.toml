"register.title" = "Le registre"
"register.lede" = "Ce que des gens ordinaires écrivent sur ce qui ne va pas dans leur vie, et sur ce qu'ils voudraient voir changer — avec, mêlées aux leurs, les doléances de 1789."
"register.intro" = "Une plainte seule est un malheur ; mille plaintes lues côte à côte sont une preuve — que la cause est commune, et que ceux qui la portent sont plus nombreux qu'ils ne le croyaient. C'est à cela que sert un registre : non pas à recueillir, mais à donner à lire. Écrire ne demande aucun compte, aucune adresse, et personne — nous compris — ne peut modifier ton texte."
"register.intro_link" = "Pourquoi ce registre existe."
