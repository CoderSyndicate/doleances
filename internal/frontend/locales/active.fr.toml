"archive.title" = "Prends-en une copie"
"archive.lede" = "Le registre entier, en fichiers simples, pour qui veut le conserver."
"archive.why" = "En 2019, la France a recueilli quelque 218 000 contributions dans environ 20 000 cahiers de mairie. Ils ont été scellés pour cinquante ans. Les contributions en ligne de la même consultation ont été publiées aussitôt — et aujourd'hui la page qui promet qu'elles sont publiques répond par une erreur de serveur. Un registre qui n'existe qu'à un seul endroit est à une ligne de budget de devenir illisible."
"archive.invitation" = "Ce registre s'exporte donc lui-même, et ce fichier est fait pour que tu le gardes. Copie-le, duplique-le, mets-le ailleurs. Ce n'est pas un usage toléré de ce site : c'est ce à quoi il sert."
