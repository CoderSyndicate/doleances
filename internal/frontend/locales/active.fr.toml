"about.recent" = "Cela s'est reproduit à l'hiver 2018 : les gilets jaunes se sont levés, première révolte de classe depuis des décennies, et les cahiers ont été ouverts — près de 20 000, pour quelque 218 000 contributions."
"about.arc" = "À deux cent trente ans d'écart, le même geste : non pas un camp politique avec un programme, mais une classe qui écrit ce qu'est devenue sa vie — et qui se saisit d'un cahier parce que rien d'autre ne la représentait."
"about.buried" = "Publié ne veut pas dire lisible : les 1,9 million de contributions reçues en ligne sont bien en open data, dans des fichiers de plusieurs gigaoctets figés depuis 2020, et le site qui permettait de les parcourir renvoie une erreur. Les cahiers des mairies ne sont plus scellés depuis 2025, mais pour les lire il faut se déplacer aux archives départementales et demander le carton. Les textes existent ; le registre, lui, n'existe plus."
"about.buried_now" = "Cela recommence pendant que tu lis. Le 5 octobre 2026, le ministre de l'Éducation nationale Édouard Geffray a lancé Agora, une plateforme en ligne destinée à recueillir les revendications et les inquiétudes des lycéens en pleine mobilisation. Qu'elle soit sincère ou non n'y change rien : ce qui s'y écrit appartient à qui l'héberge, et peut être fermé, oublié, laissé derrière une erreur de serveur, ou disparaître pour n'importe quelle raison. Ici, n'importe qui peut emporter le registre entier — c'est la seule chose qui rende un texte impossible à supprimer."
"about.purpose" = "Ce registre est ouvert par construction. Tout ce qui est publié se télécharge en bloc, avec les sujets attribués : un corpus déjà classé, pour ceux qui ont écrit, pour les sciences humaines qui voudront l'étudier, pour les mouvements qui voudront s'en servir. Le logiciel est ouvert lui aussi — le registre peut donc être vérifié, copié, réhébergé ailleurs. Rien à libérer plus tard, personne à qui le demander ; pas un open data partiel ou sans moyens techniques pour le lire."
"about.why" = "La différence ne tient pas à notre bonne volonté, et c'est précisément ce qui compte. Une plateforme peut être sincère et disparaître quand même : un budget, une réorganisation, un ministre qui change. Ici, il n'y a rien à fermer qui ne soit déjà ailleurs — ce qui est écrit est public à l'instant où il est écrit, n'importe qui peut en emporter la totalité, et le logiciel qui le sert est ouvert. Ce n'est pas la promesse de mieux se tenir que les autres ; c'est une construction où la promesse n'est pas nécessaire."
"about.privacy" = "Rien n'est recueilli à ton insu. Écrire ne demande aucun compte, aucune adresse, et le site ne te suit pas. Tu ne donnes que ce que tu choisis : un lieu, une année de naissance, une activité, tous facultatifs — et le lieu est arrondi avant d'être enregistré, jamais une adresse. Ce qui paraît, paraît anonyme."
"about.toc" = "Sur cette page"
"about.section_then" = "1789"
"about.section_again" = "2018"
"about.section_buried" = "Ce qu'il en est advenu"
"about.section_now" = "2026"
"about.section_register" = "Ce que fait ce registre"
"about.section_collected" = "Ce qui est recueilli"
"about.section_refused" = "Ce qui est refusé"
"about.section_who" = "Qui sommes-nous ?"
"about.refused" = "Tout n'est pas publié sans regard. Un filtre, puis des personnes, écartent le spam, le harcèlement et les textes qui s'en prennent à des gens pour ce qu'ils sont — le racisme n'est pas une opinion, c'est un délit, et il en va de même de toute forme de suprémacisme. Ces textes ne sont pas mis de côté : ils sont supprimés."
"about.refused_line" = "La ligne est simple. Des vues radicales, oui — contre un gouvernement, une institution, une politique, l'immigration : une doléance a le droit d'être en colère, partisane, minoritaire. Contre les droits humains, non. C'est la ligne rouge, et elle ne bouge pas. La vérification est automatique et humaine ; la garantie, c'est que rien ni personne ne peut modifier ton texte."
"about.who" = "Pour l'instant, une personne. Je travaille dans l'informatique, sur des systèmes qui doivent tenir à grande échelle : c'est mon métier, et c'est ce que je sais faire."
"about.who_why" = "Ce qui me manque est ailleurs. Des gens qui parlent de ce qui ne va pas dans leur vie avec de parfaits inconnus — je crois que c'est l'ingrédient le plus important pour qu'un changement réel commence, bien avant les programmes et les partis."
"about.who_gilets" = "C'est pourquoi j'ai adoré les gilets jaunes : de parfaits inconnus se parlaient, faisaient société, et ont exprimé une demande unique et cohérente — le RIC, le référendum d'initiative citoyenne. J'aimerais la même effervescence, mais visible de tous et pas limitée à la France."
"about.who_curators" = "Les curateurs et curatrices — celles et ceux qui lisent les textes que le filtre n'a pas tranchés — sont ajoutés de proche en proche, par un réseau de confiance : des personnes qui partagent cette vue. Et la confiance se vérifie : chaque décision, publier ou refuser, est inscrite dans un journal d'audit complet, avec le nom de qui l'a prise."
"about.section_trust" = "Peut-on se fier à nous ?"
"about.trust" = "C'est à toi d'en juger. Ce que nous pouvons garantir tient à ce que ce projet ne fait pas et à ce qu'il laisse faire : il ne stocke aucune donnée privée ; le logiciel et les données sont entièrement ouverts, téléchargeables et simples à utiliser ; et le code peut être relu par qui veut. Tu n'as pas à nous croire sur parole."
"about.trust_dropped" = "Et ce qui est refusé est public : chaque texte écarté est lisible quelques heures sur une page à part, avec son motif — et si tu penses qu'un refus est une erreur, tu peux le dire, le texte remonte alors devant une personne."

