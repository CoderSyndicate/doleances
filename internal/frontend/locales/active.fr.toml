"around.title" = "Autour de moi"
"around.lede" = "Les groupes locaux près de chez moi : où ils se réunissent, et quand. Écrire une doléance, c'est bien. En parler ensemble, c'est mieux… S'il n'y en a pas, sois le premier à en créer un !"
