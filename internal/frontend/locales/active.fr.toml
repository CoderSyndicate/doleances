"about.title" = "Les cahiers de doléances, rouverts"
"about.lede" = "Plusieurs fois depuis 1789, la France a consigné ses griefs. Jamais ceux qui les ont écrits n'en ont eu la vue d'ensemble. Ce registre la rend possible — et il ne se limite plus à la seule France."
"about.history" = "Les cahiers de doléances ont été remplis par des gens ordinaires dans les mois précédant la Révolution : ce qui n'allait pas dans leur vie, ce qu'ils voulaient voir changer et leurs espérances. Leur force tenait à ce qu'on les lise ensemble : mille tourments privés devenaient une seule condition partagée, et ceux qui la portaient, la majorité. C'est ainsi qu'une plainte devient une force politique. Ils ont été rassemblés, transmis, et ils se lisent encore aujourd'hui."
"about.today" = "La frustration politique ne manque pas. Ce qui manque, c'est un endroit où la déposer qui ne soit ni un fil de commentaires ni un flux d'actualité : ici, chaque doléance est située et rattachée à des sujets, pour que ce qui revient d'un lieu à l'autre devienne visible."
"cta.write" = "Écrire ma doléance"

"write.title" = "Écrire ta doléance"
"write.lede" = "Un grief, une proposition, un espoir ou le récit de ta vie."
"write.text" = "Ta doléance"
"write.text_hint" = "Écris autant qu'il le faut. Il n'y a pas de bonne longueur."
"write.nickname" = "Un nom"
"write.nickname_hint" = "Facultatif : un prénom, surnom, si tu en veux un. Laisse vide et ta doléance sera publiée anonymement."
"write.location" = "Où ?"
"write.location_hint" = "Facultatif. Tu décides de la précision en zoomant sur la carte — le pays par défaut. Notre garantie : pour une agglomération, nous ne descendons jamais plus bas que le quartier, afin de préserver ton anonymat."
"write.expiry" = "Supprimer automatiquement le"
"write.expiry_hint" = "Facultatif. Laisse vide et ta doléance est conservée durablement, comme partie du registre."
"write.agreement" = "Je comprends que mon texte est transmis à un service automatisé qui vérifie qu'il a sa place ici, puis lu par une personne si la machine ne tranche pas : ni spam, ni texte qui s'en prend à des gens pour ce qu'ils sont — la colère contre une politique, elle, y a sa place. Une fois publié, il paraît anonymement et tel que je l'ai écrit, et devient téléchargeable par n'importe qui : des copies peuvent subsister ailleurs même si je le supprime ensuite."
