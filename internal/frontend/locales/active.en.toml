"write.expiry" = "Delete this automatically on"
"write.expiry_hint" = "Optional. Leave it empty and your doléance is kept permanently, as part of the register."
"write.agreement" = "I understand that my text is sent to an automated service that checks it belongs here, and read by a person where the machine cannot settle it: no spam, and nothing that goes after people for what they are — anger at a policy does belong here. Once published, it appears anonymously and as I wrote it, and anyone can download a copy: copies may survive elsewhere even if I delete it afterwards."
