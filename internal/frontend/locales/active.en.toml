"about.recent" = "It happened again in the winter of 2018: the gilets jaunes rose, the first revolt along class lines in decades, and the registers were opened — around 20,000 of them, for some 218,000 contributions."
"about.arc" = "Two hundred and thirty years apart, the same act: not a political camp with a programme, but a class writing down what its life had become — reaching for a register because nothing else represented it."
"about.buried" = "Published does not mean readable: the 1.9 million contributions sent in online are open data all right, in multi-gigabyte files untouched since 2020, and the site that let you browse them returns an error. The town-hall cahiers have not been sealed since 2025, but reading one means travelling to a departmental archive and asking for the box. The texts exist; the register does not."
"about.buried_now" = "It is starting again as you read. On 5 October 2026 the education minister Édouard Geffray launched Agora, an online platform to collect the demands and worries of school students in the middle of a mobilisation. Whether it is meant sincerely changes nothing: what is written there belongs to whoever hosts it, and can be closed, forgotten, left behind a server error, or disappear for any reason at all. Here, anybody can carry away the whole register — which is the only thing that makes a text impossible to delete."
"about.purpose" = "This register is open by construction. Everything published downloads in bulk, with the subjects assigned to it: a corpus already classified, for the people who wrote it, for the humanities that want to study it, for the movements that want to use it. The software is open too — so the register can be checked, copied, rehosted elsewhere. Nothing to release later, nobody to ask for it; not an open data that is partial, or that comes with no practical means of reading it."
"about.why" = "The difference is not our good intentions, and that is exactly the point. A platform can be meant sincerely and vanish all the same: a budget, a reorganisation, a minister who moves on. Here there is nothing to close that is not already elsewhere — what is written is public the moment it is written, anybody can carry away all of it, and the software serving it is open. This is not a promise to behave better than the others; it is a construction in which the promise is not needed."
"about.privacy" = "Nothing is collected without your knowing. Writing asks for no account, no address, and the site does not follow you. You give only what you choose to give: a place, a year of birth, an activity, all optional — and the place is rounded off before it is stored, never an address. What appears, appears anonymously."
"about.toc" = "On this page"
"about.section_then" = "1789"
"about.section_again" = "2018"
"about.section_buried" = "What became of them"
"about.section_now" = "2026"
"about.section_register" = "What this register does"
"about.section_collected" = "What is collected"
"about.section_refused" = "What is refused"
"about.section_who" = "Who are we?"
"about.refused" = "Not everything is published unread. A filter, then people, turn away spam, harassment and texts that go after people for what they are — racism is not an opinion, in French law it is an offence, and the same goes for supremacism in every form. Those texts are not shelved: they are deleted."
"about.refused_line" = "The line is simple. Radical views, yes — against a government, an institution, a policy, immigration: a doléance has every right to be angry, partisan, in the minority. Against human rights, no. That is the red line, and it does not move. The checking is automatic and human; the guarantee is that nothing and nobody can alter your text."
"about.who" = "For now, one person. I work in IT, on systems that have to hold up at scale: it is my trade, and it is what I know how to do."
"about.who_why" = "What I miss is elsewhere. People talking about what is wrong in their lives with complete strangers — I believe that is the most important ingredient for any real change to begin, well ahead of programmes and parties."
"about.who_gilets" = "That is why I loved the gilets jaunes: complete strangers talked to one another, made a society of themselves, and voiced a single coherent demand — the RIC, a citizens' initiative referendum. I would like that same ferment, but visible to everyone and not confined to France."
"about.who_curators" = "The curators — the people who read what the filter could not settle — are added one by one, through a network of trust: people who share that view. And the trust is checkable: every decision, to publish or to refuse, is written to a full audit log with the name of whoever took it."
"about.section_trust" = "Can we be trusted?"
"about.trust" = "That is yours to choose. What we can guarantee lies in what this project does not do and in what it lets anyone do: it stores no private data; the software and the data are completely open, downloadable and easy to use; and the code can be reviewed by anyone who cares to. You do not have to take our word for it."
"about.trust_dropped" = "And what is refused is public: every text turned away is readable for a few hours on a page of its own, with the ground it was refused on — and if you think a refusal is a mistake you can say so, which puts the text in front of a person."

