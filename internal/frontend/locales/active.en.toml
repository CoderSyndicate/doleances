"archive.title" = "Take a copy"
"archive.lede" = "The whole register, as plain files, for anyone who wants to keep it."
"archive.why" = "In 2019 France collected some 218,000 contributions in about 20,000 town hall registers. They were sealed for fifty years. The same consultation's online contributions were published straight away — and today the page that promises they are public answers with a server error. A record that exists in only one place is one budget line away from being unreadable."
"archive.invitation" = "So this register exports itself, and you are meant to keep the file. Copy it, mirror it, put it somewhere else. That is not a tolerated use of this site; it is what the site is for."
"archive.package" = "The register, packaged"
"archive.contains" = "This package holds:"
"archive.download" = "Download"
"archive.privacy" = "No personal data. The register is anonymous by construction — no email addresses, no deletion tokens, nothing identifying anybody. That is why it can be handed to anyone."
"archive.none" = "No package has been generated yet. Come back shortly."
"archive.inside_title" = "What is inside"
"archive.inside" = "A zip of readable files. Every doléance is one Markdown file: the date, the language, the assigned subjects and the place, if the author pinned one, then the text exactly as it was written. Nobody in this system may alter a doléance, its operator included, so what you get is what was written. Unzip it and read it with anything at all."
"archive.mirror_title" = "Mirroring it"
"archive.mirror" = "Host the file yourself, seed it, hand it to an archive, load it into another installation of this software. A doléance somebody deleted is absent from every package made after that deletion — older copies in other hands are the price of a public record, and the form says so before anyone writes a word."
"archive.source_title" = "The software is free too"
"archive.source" = "The file is only half of it. This site is open source, so the thing that reads the register is as available as the register itself — you are not depending on us to keep either one alive."
"archive.source_run" = "The project publishes ready-made binaries and container images, so putting this package back online is a download and a command rather than a build. Fork it, run it for your town, change what you like."
"archive.source_link" = "Source, binaries and images on GitHub"
