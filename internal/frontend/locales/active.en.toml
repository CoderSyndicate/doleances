"register.title" = "The register"
"register.lede" = "What ordinary people write about what is wrong in their lives, and what they would like changed — with the doléances of 1789 mixed in among them."
"register.intro" = "A single complaint is a misfortune; a thousand read side by side are proof — that the cause is shared, and that the people carrying it are more numerous than they thought. That is what a register is for: not to collect, but to give to read. Writing asks for no account and no address, and nobody — us included — can alter your text."
