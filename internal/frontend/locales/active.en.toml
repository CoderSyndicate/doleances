"about.title" = "The cahiers de doléances, reopened"
"about.lede" = "Several times since 1789, France has written down its grievances. The people who wrote them have never once seen the whole. This register makes that view possible — and it is no longer limited to France alone."
"about.history" = "The original cahiers de doléances were filled in by ordinary people in the months before the Revolution: what was wrong with their lives, and what they wanted changed. Their force was in being read together: a thousand private troubles became one shared condition, and the people carrying it, the majority. That is how a complaint becomes a political force. They were collected, carried upward, and they are still readable today."
"about.today" = "There is no shortage of political frustration. What is missing is somewhere to put it that is neither a comment thread nor a news feed: here every doléance is placed and attached to subjects, so that what recurs from one place to the next becomes visible."
"cta.write" = "Write your doléance"

