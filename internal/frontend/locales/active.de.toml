"about.title" = "Die Cahiers de doléances, neu eröffnet"
"about.lede" = "Mehrmals seit 1789 hat Frankreich seine Beschwerden aufgeschrieben. Den Schreibenden blieb der Blick aufs Ganze immer verwehrt. Dieses Register macht ihn möglich — und nicht mehr nur auf Frankreich beschränkt."
"about.history" = "Die ursprünglichen Cahiers de doléances füllten einfache Leute in den Monaten vor der Revolution: was in ihrem Leben falsch lief und was sie geändert haben wollten. Ihre Kraft lag darin, zusammen gelesen zu werden: tausend private Nöte wurden zu einer gemeinsamen Lage, und die Betroffenen zur Mehrheit. So wird aus einer Klage eine politische Kraft. Sie wurden gesammelt, weitergereicht — und sind bis heute lesbar."
"about.today" = "An politischer Frustration fehlt es nicht. Es fehlt ein Ort dafür, der weder Kommentarspalte noch Nachrichtenstrom ist: Hier wird jede Doléance verortet und mit Themen verknüpft, damit sichtbar wird, was von Ort zu Ort wiederkehrt."
"cta.write" = "Deine Doléance schreiben"

"write.title" = "Deine Doléance schreiben"
"write.lede" = "Eine Beschwerde, ein Vorschlag, eine Hoffnung oder deine Lebensgeschichte."
"write.text" = "Deine Doléance"
"write.text_hint" = "Schreib so viel, wie nötig. Es gibt keine richtige Länge."
"write.nickname" = "Ein Name"
"write.nickname_hint" = "Optional: ein Vorname oder Spitzname, wenn du magst. Leer gelassen, erscheint deine Doléance anonym."
"write.location" = "Wo?"
"write.location_hint" = "Optional. Wie genau die Angabe wird, bestimmst du durch Zoomen auf der Karte — zu Beginn das Land. Unsere Garantie: In einer Stadt gehen wir nie feiner als bis zum Viertel, damit du anonym bleibst."
"write.expiry" = "Automatisch löschen am"
"write.expiry_hint" = "Optional. Leer gelassen, bleibt deine Doléance dauerhaft im Register."
"write.agreement" = "Mir ist klar, dass mein Text an einen automatischen Dienst geht, der prüft, ob er hierher gehört, und von einer Person gelesen wird, wo die Maschine nicht entscheiden kann: kein Spam, und nichts, was Menschen für das angreift, was sie sind — Zorn auf eine Politik gehört sehr wohl hierher. Einmal veröffentlicht, erscheint er anonym und so, wie ich ihn geschrieben habe, und jede und jeder kann ihn herunterladen: Kopien können anderswo fortbestehen, auch wenn ich ihn später lösche."
"write.submit" = "Absenden"
"write.examples" = "Echte Beispiele"
"write.examples_note" = "Doléances von anderen, damit du siehst, wie das aussieht."

"register.title" = "Das Register"
"register.lede" = "Was gewöhnliche Menschen darüber schreiben, was in ihrem Leben nicht stimmt und was sie geändert haben wollen — und mitten darunter die Doléances von 1789."
"register.intro" = "Eine einzelne Klage ist ein Unglück; tausend nebeneinander gelesen sind ein Beweis — dass die Ursache geteilt wird und dass die Betroffenen zahlreicher sind, als sie dachten. Dafür ist ein Register da: nicht zum Sammeln, sondern zum Lesengeben. Schreiben verlangt kein Konto und keine Adresse, und niemand — wir eingeschlossen — kann deinen Text verändern."
"register.intro_link" = "Warum es dieses Register gibt."
"register.filter_subjects" = "Themen"
"register.filter_places" = "Orte"
"register.filter_and" = "Eines oder mehrere auswählen, um die Auswahl einzugrenzen."
"register.apply" = "Filtern"
"register.empty" = "Noch passt keine Doléance zu diesem Filter."

"around.title" = "In der Nähe"
"around.lede" = "Lokale Gruppen in deiner Nähe: wo sie sich treffen und wann. Eine Doléance zu schreiben ist gut. Gemeinsam darüber zu sprechen ist besser… Wenn es hier noch keine gibt, gründe die erste!"
