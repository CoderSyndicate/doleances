"about.recent" = "Es geschah erneut im Winter 2018: Die Gelbwesten erhoben sich, der erste Klassenaufstand seit Jahrzehnten, und die Hefte wurden ausgelegt — rund 20 000, mit etwa 218 000 Beiträgen."
"about.arc" = "Zweihundertdreißig Jahre auseinander, dieselbe Handlung: kein politisches Lager mit einem Programm, sondern eine Klasse, die aufschreibt, was aus ihrem Leben geworden ist — und die zum Heft greift, weil nichts anderes sie vertrat."
"about.buried" = "Veröffentlicht heißt nicht lesbar: Die 1,9 Millionen online eingegangenen Beiträge liegen zwar als Open Data vor — in Dateien von mehreren Gigabyte, seit 2020 unverändert, und die Website, auf der man sie durchsehen konnte, antwortet mit einem Fehler. Die Hefte aus den Rathäusern sind seit 2025 nicht mehr versiegelt, aber wer sie lesen will, muss ins Departementsarchiv fahren und den Karton anfordern. Die Texte gibt es; das Register nicht."
"about.buried_now" = "Es beginnt gerade wieder, während du liest. Am 5. Oktober 2026 startete Bildungsminister Édouard Geffray die Online-Plattform Agora, um die Forderungen und Sorgen der Schülerinnen und Schüler mitten in einer Protestbewegung zu sammeln. Ob sie ernst gemeint ist, ändert daran nichts: Was dort geschrieben wird, gehört dem, der es hostet, und kann geschlossen, vergessen, hinter einem Serverfehler zurückgelassen werden oder aus irgendeinem Grund verschwinden. Hier kann jede und jeder das ganze Register mitnehmen — und nur das macht einen Text unlöschbar."
"about.purpose" = "Dieses Register ist von Grund auf offen. Alles Veröffentlichte lässt sich als Ganzes herunterladen, mitsamt den zugeordneten Themen: ein bereits klassifiziertes Korpus — für die, die geschrieben haben, für die Geisteswissenschaften, die es untersuchen wollen, für die Bewegungen, die es nutzen wollen. Auch die Software ist offen, das Register lässt sich also prüfen, kopieren, anderswo neu betreiben. Nichts, was später freigegeben werden müsste, und niemand, den man darum bitten müsste; kein Open Data, das unvollständig ist oder zu dem die technischen Mittel fehlen, es zu lesen."
"about.why" = "Der Unterschied liegt nicht in unserem guten Willen, und genau darauf kommt es an. Eine Plattform kann ernst gemeint sein und trotzdem verschwinden: ein Budget, eine Umstrukturierung, ein Minister, der wechselt. Hier gibt es nichts zu schließen, was nicht längst anderswo liegt — was geschrieben wird, ist in dem Moment öffentlich, in dem es geschrieben wird, jede und jeder kann alles mitnehmen, und die Software dahinter ist offen. Das ist kein Versprechen, sich besser zu benehmen als die anderen; es ist eine Architektur, in der das Versprechen nicht notwendig ist."
"about.privacy" = "Nichts wird ohne dein Wissen erhoben. Schreiben verlangt kein Konto, keine Adresse, und die Seite verfolgt dich nicht. Du gibst nur, was du geben willst: einen Ort, ein Geburtsjahr, eine Tätigkeit, alles freiwillig — und der Ort wird gerundet, bevor er gespeichert wird, nie eine Adresse. Was erscheint, erscheint anonym."
"about.toc" = "Auf dieser Seite"
"about.section_then" = "1789"
"about.section_again" = "2018"
"about.section_buried" = "Was daraus wurde"
"about.section_now" = "2026"
"about.section_register" = "Was dieses Register tut"
"about.section_collected" = "Was erhoben wird"
"about.section_refused" = "Was abgelehnt wird"
"about.section_who" = "Wer sind wir?"
"about.refused" = "Nicht alles wird ungelesen veröffentlicht. Ein Filter und dann Menschen sortieren Spam, Belästigung und Texte aus, die Menschen für das angreifen, was sie sind — Rassismus ist keine Meinung, nach französischem Recht ist er eine Straftat, und dasselbe gilt für jede Form von Suprematismus. Diese Texte werden nicht abgelegt, sondern gelöscht."
"about.refused_line" = "Die Linie ist einfach. Radikale Ansichten, ja — gegen eine Regierung, eine Institution, eine Politik, die Einwanderung: Eine Doléance darf zornig sein, parteiisch, in der Minderheit. Gegen die Menschenrechte, nein. Das ist die rote Linie, und sie bewegt sich nicht. Geprüft wird maschinell und menschlich; die Garantie ist, dass nichts und niemand deinen Text verändern kann."
"about.who" = "Vorerst eine Person. Ich arbeite in der IT, an Systemen, die in großem Maßstab halten müssen: Das ist mein Beruf, und das kann ich."
"about.who_why" = "Was mir fehlt, liegt woanders. Menschen, die mit völlig Fremden darüber reden, was in ihrem Leben nicht stimmt — ich glaube, das ist die wichtigste Zutat, damit echte Veränderung überhaupt beginnt, lange vor Programmen und Parteien."
"about.who_gilets" = "Deshalb habe ich die Gelbwesten geliebt: Wildfremde redeten miteinander, wurden zu einer Gesellschaft und brachten eine einzige, stimmige Forderung hervor — das RIC, ein Referendum auf Bürgerinitiative. Ich wünschte mir dieselbe Gärung, aber für alle sichtbar und nicht auf Frankreich beschränkt."
"about.who_curators" = "Die Kuratorinnen und Kuratoren — die lesen, was der Filter nicht entscheiden konnte — kommen nach und nach über ein Netz des Vertrauens dazu: Menschen, die diese Sicht teilen. Und das Vertrauen ist überprüfbar: Jede Entscheidung, veröffentlichen oder ablehnen, steht mit dem Namen dessen, der sie getroffen hat, in einem vollständigen Prüfprotokoll."
"about.section_trust" = "Kann man uns vertrauen?"
"about.trust" = "Das entscheidest du. Was wir garantieren können, liegt in dem, was dieses Projekt nicht tut, und in dem, was es jedem erlaubt: Es speichert keine privaten Daten; Software und Daten sind vollständig offen, herunterladbar und einfach zu nutzen; und den Code kann prüfen, wer will. Du musst uns nicht beim Wort nehmen."
"about.trust_dropped" = "Und was abgelehnt wird, ist öffentlich: Jeder aussortierte Text ist einige Stunden lang auf einer eigenen Seite lesbar, mit dem Grund — und wenn du eine Ablehnung für einen Fehler hältst, kannst du das sagen; dann landet der Text vor einem Menschen."

