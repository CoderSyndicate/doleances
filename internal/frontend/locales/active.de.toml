"archive.title" = "Kopie mitnehmen"
"archive.lede" = "Das ganze Register als einfache Dateien, für alle, die es behalten wollen."
"archive.why" = "2019 sammelte Frankreich rund 218 000 Beiträge in etwa 20 000 Rathausheften. Sie wurden für fünfzig Jahre versiegelt. Die Online-Beiträge derselben Konsultation wurden sofort veröffentlicht — und heute antwortet die Seite, die ihre Öffentlichkeit verspricht, mit einem Serverfehler. Ein Register, das nur an einem Ort existiert, ist eine Haushaltszeile davon entfernt, unlesbar zu werden."
"archive.invitation" = "Dieses Register exportiert sich daher selbst, und die Datei ist zum Behalten gedacht. Kopier sie, spiegle sie, leg sie anderswo ab. Das ist keine geduldete Nutzung dieser Seite, sondern ihr Zweck."
