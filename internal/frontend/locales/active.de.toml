"footer.title" = "Offen und überprüfbar"
"footer.about" = "Doléances ist ein offenes Register für Beschwerden und Vorschläge, nach Ort geordnet."
"footer.openness" = "Alles Veröffentlichte lässt sich am Stück herunterladen, mit den zugeordneten Themen, unter einer freien Lizenz. Auch die Software hinter dieser Seite ist offen: Dieses Register kann von jeder und jedem geprüft, kopiert und anderswo weiterbetrieben werden, ohne jemanden um Erlaubnis zu fragen."
