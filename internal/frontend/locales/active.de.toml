"archive.contains" = "Dieses Paket enthält:"
"archive.download" = "Herunterladen"
"archive.privacy" = "Keine persönlichen Daten. Das Register ist von Grund auf anonym — keine E-Mail-Adressen, keine Löschtoken, nichts, was jemanden identifiziert. Genau deshalb darf es jede und jeder bekommen."
"archive.none" = "Es wurde noch kein Paket erzeugt. Schau bald wieder vorbei."
"archive.inside_title" = "Was darin ist"
"archive.inside" = "Ein ZIP aus lesbaren Dateien. Jede Doléance ist eine Markdown-Datei: Datum, Sprache, zugewiesene Themen und der Ort, falls angegeben, dann der Text genau so, wie er geschrieben wurde. Niemand hier darf eine Doléance ändern, auch der Betreiber nicht — du erhältst also das Geschriebene. Entpacken und mit irgendetwas lesen."
"archive.mirror_title" = "Weitergeben"
"archive.mirror" = "Hoste die Datei selbst, teile sie, gib sie einem Archiv, lade sie in eine andere Installation dieser Software. Eine von ihrer Autorin gelöschte Doléance fehlt in jedem danach erzeugten Paket — ältere Kopien in fremden Händen sind der Preis eines öffentlichen Registers, und das Formular sagt es, bevor jemand ein Wort schreibt."
"archive.source_title" = "Die Software ist auch frei"
"archive.source" = "Die Datei ist nur die Hälfte. Diese Seite ist Open Source: Was das Register liest, ist ebenso verfügbar wie das Register selbst — du hängst für beides nicht an uns."
"archive.source_run" = "Das Projekt veröffentlicht fertige Binaries und Container-Images: Dieses Paket wieder online zu stellen, ist ein Download und ein Befehl, kein Build. Fork es, betreib es für deinen Ort, änder, was du willst."
