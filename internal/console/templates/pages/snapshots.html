{{define "content"}}
<div class="prose">
  <h1>{{ .T "snapshots.title" }}</h1>
  <p class="lede">{{ .T "snapshots.lede" }}</p>
  <p class="section-note">{{ .T "snapshots.purpose" }}</p>
</div>

<form id="create-form" class="prose">
  <label for="snapshot_kind">{{ .T "snapshots.kind" }}
    <span class="hint" id="kind-hint"></span>
  </label>
  <select id="snapshot_kind" name="snapshot_kind">
    <option value="contributions">{{ .T "snapshots.kind_contributions" }}</option>
    <option value="full">{{ .T "snapshots.kind_full" }}</option>
  </select>

  <label for="snapshot_tag">{{ .T "snapshots.tag" }}
    <span class="hint">{{ .T "snapshots.tag_hint" }}</span>
  </label>
  <input type="text" id="snapshot_tag" name="snapshot_tag" maxlength="128" pattern="[a-zA-Z0-9._\-]*">

  <label for="snapshot_notes">{{ .T "snapshots.notes" }}
    <span class="hint">{{ .T "snapshots.notes_hint" }}</span>
  </label>
  <input type="text" id="snapshot_notes" name="snapshot_notes" maxlength="500">

  <div class="theme-bar">
    <button class="button" type="submit">{{ .T "snapshots.create" }}</button>
  </div>
</form>

<p id="status" class="section-note" role="status" aria-live="polite"></p>

<h2>{{ .T "snapshots.stored" }}</h2>
<div id="items" class="themes"></div>

<h2>{{ .T "snapshots.restore_title" }}</h2>
<div class="prose">
  <p class="section-note">{{ .T "snapshots.restore_warning" }}</p>
</div>
<form id="restore-form" class="prose">
  <label for="restore_file">{{ .T "snapshots.restore_file" }}</label>
  <input type="file" id="restore_file" name="file" accept=".zip,application/zip">
  <div class="theme-bar">
    <button class="button secondary" type="submit">{{ .T "snapshots.restore" }}</button>
  </div>
</form>
<p id="restore-status" class="section-note" role="status" aria-live="polite"></p>

<noscript>
  <p class="empty">{{ .T "snapshots.noscript" }}</p>
</noscript>

<script nonce="{{ .Nonce }}">
  window.snapshotStrings = {
    empty: {{ .T "snapshots.empty" }},
    download: {{ .T "snapshots.download" }},
    remove: {{ .T "snapshots.delete" }},
    confirmDelete: {{ .T "snapshots.confirm_delete" }},
    confirmRestore: {{ .T "snapshots.confirm_restore" }},
    creating: {{ .T "snapshots.creating" }},
    created: {{ .T "snapshots.created" }},
    failed: {{ .T "snapshots.failed" }},
    restoring: {{ .T "snapshots.restoring" }},
    restored: {{ .T "snapshots.restored" }},
    restoreNoFile: {{ .T "snapshots.restore_no_file" }},
    personal: {{ .T "snapshots.personal" }},
    publicLabel: {{ .T "snapshots.public" }},
    fullDisabled: {{ .T "snapshots.full_disabled" }},
    hintContributions: {{ .T "snapshots.kind_contributions_hint" }},
    hintFull: {{ .T "snapshots.kind_full_hint" }},
    records: {{ .T "snapshots.records" }}
  };
</script>
<script src="/static/snapshots.js?v={{ .AssetVersion }}"></script>
{{end}}
