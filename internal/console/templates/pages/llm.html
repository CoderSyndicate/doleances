{{define "content"}}
<div class="prose">
  <h1>{{ .T "llm.title" }}</h1>
  <p class="lede">{{ .T "llm.lede" }}</p>
  <p class="section-note">{{ .T "llm.audit_note" }}</p>
</div>

<form id="llm-form" class="prose" autocomplete="off">
  <h2>{{ .T "llm.section_endpoint" }}</h2>

  <label for="base_url">{{ .T "llm.base_url" }}
    <span class="hint">{{ .T "llm.base_url_hint" }}</span>
  </label>
  <input type="text" id="base_url" name="base_url" placeholder="https://synergia.example.org" spellcheck="false">

  <label for="api_key">{{ .T "llm.api_key" }}
    <span class="hint" id="key-state">{{ .T "llm.api_key_hint" }}</span>
  </label>
  <input type="password" id="api_key" name="api_key" autocomplete="new-password" spellcheck="false">
  <button type="button" class="button small danger" id="clear-key">{{ .T "llm.clear_key" }}</button>

  <label for="timeout_seconds">{{ .T "llm.timeout" }}
    <span class="hint">{{ .T "llm.timeout_hint" }}</span>
  </label>
  <input type="number" id="timeout_seconds" name="timeout_seconds" min="1" max="600">

  <h2>{{ .T "llm.section_models" }}</h2>

  <label for="classification_model">{{ .T "llm.model_classification" }}
    <span class="hint">{{ .T "llm.model_classification_hint" }}</span>
  </label>
  <input type="text" id="classification_model" name="classification_model" spellcheck="false">

  <label for="translation_model">{{ .T "llm.model_translation" }}
    <span class="hint">{{ .T "llm.model_translation_hint" }}</span>
  </label>
  <input type="text" id="translation_model" name="translation_model" spellcheck="false">

  <h2>{{ .T "llm.section_thresholds" }}</h2>
  <p class="section-note">{{ .T "llm.thresholds_note" }}</p>

  <label for="accept_threshold">{{ .T "llm.accept" }}
    <span class="hint">{{ .T "llm.accept_hint" }}</span>
  </label>
  <input type="number" id="accept_threshold" name="accept_threshold" min="0" max="100">

  <label for="curate_threshold">{{ .T "llm.curate" }}
    <span class="hint">{{ .T "llm.curate_hint" }}</span>
  </label>
  <input type="number" id="curate_threshold" name="curate_threshold" min="0" max="100">

  <div class="theme-bar">
    <button class="button" type="submit">{{ .T "llm.save" }}</button>
    <button class="button secondary" type="button" id="test">{{ .T "llm.test" }}</button>
  </div>
</form>

<p id="status" class="section-note" role="status" aria-live="polite"></p>
<div id="models" class="subjects"></div>

<noscript>
  <p class="empty">{{ .T "llm.noscript" }}</p>
</noscript>

<script nonce="{{ .Nonce }}">
  window.llmStrings = {
    keySet: {{ .T "llm.key_set" }},
    keyUnset: {{ .T "llm.key_unset" }},
    confirmClear: {{ .T "llm.confirm_clear" }},
    saving: {{ .T "llm.saving" }},
    saved: {{ .T "llm.saved" }},
    testing: {{ .T "llm.testing" }},
    failed: {{ .T "llm.failed" }}
  };
</script>
<script src="/static/llm.js?v={{ .AssetVersion }}"></script>
{{end}}
