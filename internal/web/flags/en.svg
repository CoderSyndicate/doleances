<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" role="img">
  <!-- The counterchange of the red saltire is what the clip path is for: the
       red sits on one side of the white in each quarter, which is the half of
       this flag people draw wrong. The id is safe because this is its own
       document, served as a file rather than inlined into the page. -->
  <clipPath id="quarters">
    <path d="M30,20 h30 v20 z v20 h-30 z h-30 v-20 z v-20 h30 z"/>
  </clipPath>
  <rect width="60" height="40" fill="#012169"/>
  <path d="M0,0 L60,40 M60,0 L0,40" stroke="#ffffff" stroke-width="8"/>
  <path d="M0,0 L60,40 M60,0 L0,40" stroke="#c8102e" stroke-width="5"
        clip-path="url(#quarters)"/>
  <path d="M30,0 v40 M0,20 h60" stroke="#ffffff" stroke-width="13.334"/>
  <path d="M30,0 v40 M0,20 h60" stroke="#c8102e" stroke-width="8"/>
</svg>
